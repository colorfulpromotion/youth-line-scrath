<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >

  <title>&youth! LINE限定スクラッチ</title>

  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans JP",
        "Helvetica Neue",
        Arial,
        sans-serif;

      background:
        linear-gradient(
          145deg,
          #ffffff,
          #f4f4f4
        );

      color: #111;
    }

    .wrap {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 34px 18px 60px;
    }

    .logo {
      text-align: center;
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -2px;
      margin-top: 8px;
    }

    .sub-logo {
      text-align: center;
      margin-top: 3px;
      font-size: 9px;
      letter-spacing: 5px;
      color: #aaa;
    }

    h1 {
      margin: 28px 0 5px;
      text-align: center;
      font-size: 20px;
    }

    .lead {
      text-align: center;
      color: #777;
      font-size: 13px;
      line-height: 1.8;
      margin-bottom: 24px;
    }

    .scratch-wrap {
      background: #eeeeee;
      padding: 14px;
      border-radius: 22px;
      box-shadow: 0 8px 25px rgba(0,0,0,.06);
    }

    .scratch-box {
      position: relative;
      width: 100%;
      aspect-ratio: 1.55 / 1;
      overflow: hidden;
      background: #fff;
      border-radius: 16px;
    }

    .result {
      position: absolute;
      inset: 0;
      z-index: 1;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 20px;
      text-align: center;
    }

    .result-label {
      font-size: 9px;
      letter-spacing: 4px;
      color: #bbb;
    }

    #prize {
      margin-top: 9px;
      font-size: 32px;
      font-weight: 900;
    }

    #detail {
      margin-top: 8px;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.6;
    }

    #numberLabel {
      margin-top: 18px;
      font-size: 10px;
      color: #999;
      display: none;
    }

    #number {
      margin-top: 4px;
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    canvas {
      position: absolute;
      inset: 0;
      z-index: 2;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .scratch-note {
      text-align: center;
      margin-top: 11px;
      font-size: 12px;
      color: #777;
    }

    #status {
      margin-top: 14px;
      text-align: center;
      font-size: 12px;
      color: #888;
      min-height: 20px;
    }

    .info {
      margin-top: 28px;
      background: rgba(255,255,255,.85);
      border-radius: 18px;
      padding: 18px;
      font-size: 12px;
      color: #666;
      line-height: 2;
    }

    .info-title {
      font-weight: 800;
      color: #333;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 999;

      display: flex;
      align-items: center;
      justify-content: center;

      background: rgba(255,255,255,.92);

      padding: 30px;
      text-align: center;
      font-weight: 800;
      font-size: 14px;
    }

    .error {
      color: #b00020;
      line-height: 1.8;
    }

    #bridge {
      position: absolute;
      width: 1px;
      height: 1px;
      border: 0;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div class="wrap">

    <div class="logo">&amp;youth!</div>

    <div class="sub-logo">
      LINE LIMITED SCRATCH
    </div>

    <h1>🎟 LINE限定スクラッチ</h1>

    <div class="lead">
      スクラッチを削って、限定特典をGET！<br>
      指でなぞって削ってね。
    </div>

    <div class="scratch-wrap">

      <div class="scratch-box">

        <div class="result">

          <div class="result-label">
            YOUR RESULT
          </div>

          <div id="prize">
            ？
          </div>

          <div id="detail">
            スクラッチを削ってください
          </div>

          <div id="numberLabel">
            当選番号
          </div>

          <div id="number"></div>

        </div>

        <canvas id="scratch"></canvas>

      </div>

      <div class="scratch-note">
        👆 指でなぞって削ってね
      </div>

    </div>

    <div id="status">
      準備中…
    </div>

    <div class="info">

      <div class="info-title">
        【ご利用について】
      </div>

      ・スクラッチへの参加はお一人様1回までとなります。<br>
      ・当選された場合は、当選画面を特典会スタッフへご提示ください。<br>
      ・発行された当選番号は1回のみ使用できます。<br>
      ・使用後はスタッフが当選番号を「使用済み」に変更します。<br>
      ・特典の利用条件については運営の案内に従ってください。

    </div>

  </div>


  <!-- Apps Scriptとの通信専用 -->
  <iframe
    id="bridge"
    src="https://script.google.com/macros/s/AKfycbxGL5SHscu7lA1q11M4fPfXSKePlWSQfUaMq-wvuJAlH9odzm1_GiKTsj0zKTXvN1JP/exec?page=bridge"
  ></iframe>


  <div id="loading">
    スクラッチを準備しています…
  </div>


<script>

const LIFF_ID =
  "2011510582-KvMnJHML";

const BRIDGE_ORIGIN =
  "https://script.google.com";

const loading =
  document.getElementById("loading");

const statusEl =
  document.getElementById("status");

const canvas =
  document.getElementById("scratch");

const ctx =
  canvas.getContext("2d");

let resultData = null;

let bridgeReady = false;

let drawing = false;

let revealed = false;

let lastX = 0;
let lastY = 0;


/* =========================
   Apps Script bridge通信
========================= */

const pendingRequests =
  new Map();


window.addEventListener(
  "message",
  function(event) {

    const data =
      event.data || {};

    if (
      data.type === "BRIDGE_READY"
    ) {
      bridgeReady = true;
      return;
    }

    if (
      data.type !==
      "ISSUE_RESULT_RESPONSE"
    ) {
      return;
    }

    const pending =
      pendingRequests.get(
        data.requestId
      );

    if (!pending) {
      return;
    }

    pendingRequests.delete(
      data.requestId
    );

    if (data.error) {
      pending.reject(
        new Error(data.error)
      );
      return;
    }

    pending.resolve(
      data.result
    );

  }
);


function waitForBridge() {

  return new Promise(
    (resolve, reject) => {

      const started =
        Date.now();

      const timer =
        setInterval(() => {

          if (bridgeReady) {

            clearInterval(timer);
            resolve();

            return;

          }

          if (
            Date.now() - started >
            15000
          ) {

            clearInterval(timer);

            reject(
              new Error(
                "抽選サーバーとの接続に失敗しました。"
              )
            );

          }

        }, 100);

    }
  );

}


function issueResult(
  lineUserId
) {

  return new Promise(
    (resolve, reject) => {

      const requestId =
        "req_" +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .slice(2);

      pendingRequests.set(
        requestId,
        {
          resolve,
          reject
        }
      );

      const bridge =
        document.getElementById(
          "bridge"
        );

      bridge.contentWindow
        .postMessage(
          {
            type:
              "ISSUE_RESULT",

            requestId:
              requestId,

            lineUserId:
              lineUserId
          },
          "*"
        );

      setTimeout(() => {

        if (
          pendingRequests.has(
            requestId
          )
        ) {

          pendingRequests.delete(
            requestId
          );

          reject(
            new Error(
              "抽選結果の取得がタイムアウトしました。"
            )
          );

        }

      }, 20000);

    }
  );

}


/* =========================
   スクラッチ作成
========================= */

function setupScratch() {

  const rect =
    canvas.getBoundingClientRect();

  const ratio =
    window.devicePixelRatio || 1;

  canvas.width =
    rect.width * ratio;

  canvas.height =
    rect.height * ratio;

  ctx.setTransform(
    ratio,
    0,
    0,
    ratio,
    0,
    0
  );

  ctx.globalCompositeOperation =
    "source-over";

  ctx.fillStyle =
    "#d8d8d8";

  ctx.fillRect(
    0,
    0,
    rect.width,
    rect.height
  );

  ctx.fillStyle =
    "#ffffff";

  ctx.font =
    "700 16px sans-serif";

  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "middle";

  ctx.fillText(
    "SCRATCH",
    rect.width / 2,
    rect.height / 2 - 10
  );

  ctx.font =
    "12px sans-serif";

  ctx.fillText(
    "指で削ってください",
    rect.width / 2,
    rect.height / 2 + 18
  );

}


function pointFromEvent(e) {

  const rect =
    canvas.getBoundingClientRect();

  const touch =
    e.touches
      ? e.touches[0]
      : e;

  return {
    x:
      touch.clientX -
      rect.left,

    y:
      touch.clientY -
      rect.top
  };

}


function startDraw(e) {

  if (revealed) {
    return;
  }

  drawing = true;

  const p =
    pointFromEvent(e);

  lastX = p.x;
  lastY = p.y;

}


function draw(e) {

  if (
    !drawing ||
    revealed
  ) {
    return;
  }

  e.preventDefault();

  const p =
    pointFromEvent(e);

  ctx.globalCompositeOperation =
    "destination-out";

  ctx.lineWidth = 42;

  ctx.lineCap =
    "round";

  ctx.lineJoin =
    "round";

  ctx.beginPath();

  ctx.moveTo(
    lastX,
    lastY
  );

  ctx.lineTo(
    p.x,
    p.y
  );

  ctx.stroke();

  lastX = p.x;
  lastY = p.y;

  checkReveal();

}


function stopDraw() {
  drawing = false;
}


function checkReveal() {

  const image =
    ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    );

  let transparent = 0;

  let total = 0;

  for (
    let i = 3;
    i < image.data.length;
    i += 40
  ) {

    total++;

    if (
      image.data[i] < 60
    ) {
      transparent++;
    }

  }

  const percent =
    transparent /
    total *
    100;

  if (
    percent >= 45 &&
    !revealed
  ) {

    revealResult();

  }

}


function revealResult() {

  revealed = true;

  canvas.style.transition =
    "opacity .35s";

  canvas.style.opacity =
    "0";

  setTimeout(() => {

    canvas.style.display =
      "none";

  }, 350);


  document
    .getElementById("prize")
    .textContent =
      resultData.prize || "";


  document
    .getElementById("detail")
    .textContent =
      resultData.detail || "";


  if (
    resultData.number
  ) {

    document
      .getElementById(
        "numberLabel"
      )
      .style.display =
        "block";

    document
      .getElementById(
        "number"
      )
      .textContent =
        resultData.number;

  }


  if (
    resultData.prize ===
    "ハズレ"
  ) {

    statusEl.textContent =
      "また来月チャレンジしてね！";

  } else {

    statusEl.textContent =
      "当選画面をスタッフへご提示ください。";

  }

}


canvas.addEventListener(
  "mousedown",
  startDraw
);

canvas.addEventListener(
  "mousemove",
  draw
);

window.addEventListener(
  "mouseup",
  stopDraw
);


canvas.addEventListener(
  "touchstart",
  startDraw,
  {
    passive: false
  }
);

canvas.addEventListener(
  "touchmove",
  draw,
  {
    passive: false
  }
);

canvas.addEventListener(
  "touchend",
  stopDraw
);


/* =========================
   起動処理
========================= */

async function start() {

  try {

    loading.textContent =
      "LINEに接続しています…";


    await liff.init({
      liffId: LIFF_ID
    });


    if (
      !liff.isLoggedIn()
    ) {

      liff.login();
      return;

    }


    loading.textContent =
      "LINE情報を確認しています…";


    const profile =
      await liff.getProfile();


    if (
      !profile ||
      !profile.userId
    ) {

      throw new Error(
        "LINEユーザー情報を取得できませんでした。"
      );

    }


    loading.textContent =
      "抽選サーバーに接続しています…";


    await waitForBridge();


    loading.textContent =
      "抽選結果を取得しています…";


    resultData =
      await issueResult(
        profile.userId
      );


    if (
      !resultData ||
      !resultData.ok
    ) {

      throw new Error(
        "抽選結果を取得できませんでした。"
      );

    }


    setupScratch();


    if (
      resultData.already
    ) {

      statusEl.textContent =
        "前回の抽選結果を表示します。";

    } else {

      statusEl.textContent =
        "スクラッチを削ってください！";

    }


    loading.style.display =
      "none";


  } catch (error) {

    console.error(error);

    loading.innerHTML =
      '<div class="error">' +
      '<b>エラーが発生しました</b>' +
      '<br><br>' +
      String(
        error.message ||
        error
      ) +
      '<br><br>' +
      '一度画面を閉じて、もう一度お試しください。' +
      '</div>';

  }

}


start();

</script>

</body>
</html>
